<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="google-site-verification" content="DuO0mIgeEwNUmCvgp2-J3IqKSSBLM4iQ-wym8nXYubw" />

    <!-- Fallback head for dev and for anything the prerender does not write. Keep the
         description in sync with ROUTE_SEO.home in seo-routes.ts; the build overwrites it per route. -->
    <meta name="description" content="One board for your jobs, customers and paperwork, built around how you already work. Tell us how you run things and we'll build you a free demo." />
    <link rel="canonical" href="https://streamlinedai.tech/" />

    <meta property="og:title" content="Custom Apps for Trade and Service Businesses | Streamlined Tech" />
    <meta property="og:description" content="One board for your jobs, customers and paperwork, built around how you already work. Tell us how you run things and we'll build you a free demo." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://streamlinedai.tech/" />
    <meta property="og:image" content="https://streamlinedai.tech/images/og-card-home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Custom Apps for Trade and Service Businesses | Streamlined Tech" />
    <meta name="twitter:description" content="One board for your jobs, customers and paperwork, built around how you already work. Tell us how you run things and we'll build you a free demo." />
    <meta name="twitter:image" content="https://streamlinedai.tech/images/og-card-home.png" />

    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <title>Custom Apps for Trade and Service Businesses | Streamlined Tech</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Streamlined Tech",
        "legalName": "Streamlined Digital Tech Limited",
        "url": "https://streamlinedai.tech/",
        "logo": "https://streamlinedai.tech/images/logo-mark.png",
        "description": "Custom apps for trade and service businesses. Your own app, built around how you already work, with everything in one place.",
        "founder": { "@type": "Person", "name": "Pete Harris" },
        "address": { "@type": "PostalAddress", "addressCountry": "IE" },
        "areaServed": [{ "@type": "Country", "name": "Ireland" }],
        "knowsAbout": [
          "custom apps for trade and service businesses",
          "job management",
          "service reminders",
          "job sheets"
        ]
      }
    </script>

    <!-- Vercel Speed Insights, cookieless and first-party, so no consent
         gate. Web Analytics is injected from client/src/main.tsx because its
         script lives at a per-project path only known at build time. The
         catch-all SPA rewrite in vercel.json must keep excluding /_vercel/. -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
