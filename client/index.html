<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="google-site-verification" content="DuO0mIgeEwNUmCvgp2-J3IqKSSBLM4iQ-wym8nXYubw" />

    <meta name="description" content="We set businesses up with AI. Custom internal apps and automation around how you already run, from Galway for Irish businesses and Australian operations." />
    <link rel="canonical" href="https://streamlinedai.tech/" />

    <meta property="og:title" content="Set Your Business Up with AI | Streamlined Tech" />
    <meta property="og:description" content="We set businesses up with AI. Custom internal apps and automation around how you already run, from Galway for Irish businesses and Australian operations." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://streamlinedai.tech/" />
    <meta property="og:image" content="https://streamlinedai.tech/images/og-card-home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Set Your Business Up with AI | Streamlined Tech" />
    <meta name="twitter:description" content="We set businesses up with AI. Custom internal apps and automation around how you already run, from Galway for Irish businesses and Australian operations." />
    <meta name="twitter:image" content="https://streamlinedai.tech/images/og-card-home.png" />

    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <!-- Dev-only default. In the build, vite-plugin-prerender-meta strips
         image preloads and injects each route's own from RouteSeo.preloads
         in seo-routes.ts; keep this in sync with ROUTE_SEO.home.preloads. -->
    <link rel="preload" as="image" href="/images/hero-operations.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Set Your Business Up with AI | Streamlined Tech</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Streamlined Tech",
        "url": "https://streamlinedai.tech/",
        "logo": "https://streamlinedai.tech/images/logo.webp",
        "description": "We set businesses up with AI. Custom internal apps and workflow automation, built around how a business already runs, from Galway for Irish businesses and Australian mining and construction operations.",
        "founder": { "@type": "Person", "name": "Pete Harris" },
        "address": { "@type": "PostalAddress", "addressCountry": "IE" },
        "areaServed": [
          { "@type": "Country", "name": "Australia" },
          { "@type": "Country", "name": "Ireland" },
          { "@type": "Country", "name": "United Kingdom" }
        ],
        "knowsAbout": [
          "workflow automation",
          "custom internal apps",
          "mining operations",
          "construction operations",
          "safety and compliance reporting"
        ],
        "owns": [
          {
            "@type": "SoftwareApplication",
            "name": "AutoListing.io",
            "url": "https://autolisting.io",
            "applicationCategory": "BusinessApplication"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Rangplan.ie",
            "url": "https://rangplan.ie",
            "applicationCategory": "BusinessApplication"
          }
        ]
      }
    </script>

    <!-- Vercel Speed Insights, cookieless and first-party, so no consent
         gate. Web Analytics is injected from client/src/main.tsx because its
         script lives at a per-project path only known at build time. The
         catch-all SPA rewrite in vercel.json must keep excluding /_vercel/. -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
