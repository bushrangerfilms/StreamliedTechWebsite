    <!-- Vercel Speed Insights, cookieless and first-party, so no consent
         gate. Web Analytics is injected from client/src/main.tsx because its
         script lives at a per-project path only known at build time. The
         catch-all SPA rewrite in vercel.json must keep excluding /_vercel/. -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
